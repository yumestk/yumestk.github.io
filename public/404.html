<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA fallback — store the full path and redirect to index
    sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);
    location.replace('/blog-web/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
