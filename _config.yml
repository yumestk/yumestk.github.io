title: Kirari In Wonderland
subtitle: Down the Rabbit-Hole
description: 你好，这里是 yumestk 的个人空间。留下一些学习的足迹，收集一些生活里的小小回响。
author: Kirari
language: zh-CN
timezone: Asia/Shanghai
url: https://yumestk.github.io
root: /
permalink: blog/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: blog
category_dir: categories
include:
  - .nojekyll
skip_render:
  - robots.txt
  - .nojekyll
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
prismjs:
  enable: false
default_category: 随笔
date_format: YYYY-MM-DD
time_format: HH:mm:ss
pagination_dir: page
per_page: 10
index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  enabled: true
  per_page: 20
  yearly: true
  monthly: true
category_generator:
  per_page: 10
tag_generator:
  per_page: 10
search:
  path: search.json
  field: post
  content: true
  format: striptags
sitemap:
  path: sitemap.xml
  rel: false
theme: butterfly
